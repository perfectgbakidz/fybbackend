services:
  - type: web
    name: nacos-flyer-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 60"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_WEBHOOK_HASH
        sync: false
      - key: FRONTEND_URL
        value: http://localhost:3000
    healthCheckPath: /health
